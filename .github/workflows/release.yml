name: Release (PyPI)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      dist_files: ${{ steps.make_dist_output.outputs.dist_files }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.cfg') }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build sdist and wheel
        run: |
          python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.ref_name }}
          path: dist/*

      - name: Smoke test built wheel
        run: |
          python -m pip install --upgrade pip virtualenv
          python -m virtualenv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --no-deps dist/*.whl
          echo "Installed packages:" && python -m pip show NanoChemGPT || (python -m pip list && echo "NanoChemGPT not found" && exit 1)
          deactivate

      - name: Publish to PyPI (or custom repository)
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PUBLISH_REPOSITORY_URL: ${{ secrets.PUBLISH_REPOSITORY_URL }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is not set; skipping publish.";
            exit 0;
          fi
          if [ -n "${PUBLISH_REPOSITORY_URL}" ]; then
            python -m twine upload --repository-url "${PUBLISH_REPOSITORY_URL}" -u __token__ -p "${PYPI_API_TOKEN}" dist/*;
          else
            python -m twine upload -u __token__ -p "${PYPI_API_TOKEN}" dist/*;
          fi

    - name: Read first subsection under Unreleased from CHANGELOG.md
    id: get_changelog
    run: |
      python - <<'PY' > changelog.tmp
import re
txt = open('CHANGELOG.md', encoding='utf-8').read()
# capture Unreleased block
m = re.search(r"^##\s*\[Unreleased\](.*?)(?=^##\s*\[)", txt, flags=re.S|re.M)
if not m:
  print('')
  raise SystemExit(0)
block = m.group(1)
# look for first subsection '###'
sub = re.search(r"(?m)^###\s*.*$", block)
if sub:
  start = sub.start()
  # find next subsection after the first
  rest = block[start+1:]
  next_sub = re.search(r"(?m)^###\s*.*$", rest)
  if next_sub:
    end = start + 1 + next_sub.start()
    content = block[start:end].strip()
  else:
    content = block[start:].strip()
else:
  # fallback to first non-empty paragraph
  p = re.search(r"(.*?)(?:\n\n|$)", block, flags=re.S)
  content = p.group(1).strip() if p else block.strip()
print(content)
PY
      echo "changelog<<EOF" >> $GITHUB_OUTPUT
      cat changelog.tmp >> $GITHUB_OUTPUT
      echo "EOF" >> $GITHUB_OUTPUT
      rm changelog.tmp

      - name: Create GitHub Release (draft)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: ${{ steps.get_changelog.outputs.changelog }}
      - name: Make dist files list for upload
        id: make_dist_output
        run: |
          python - <<'PY' > files.json
import json,glob,os
files=[os.path.basename(p) for p in sorted(glob.glob('dist/*'))]
print(json.dumps(files))
PY
          echo "dist_files<<EOF" >> $GITHUB_OUTPUT
          cat files.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          rm files.json

  upload-assets:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-wheel.outputs.dist_files) }}
    steps:
      - name: Upload dist file
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.build-wheel.outputs.upload_url }}
          asset_path: dist/${{ matrix.file }}
          asset_name: ${{ matrix.file }}

  build-docker:
    runs-on: ubuntu-latest
    needs: upload-assets
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout (to get Dockerfile & context)
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-${{ github.ref_name }}
          path: ./dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for smoke-run
        run: |
          docker build -f Dockerfile -t local-test:${{ github.sha }} .

      - name: Smoke-run built image (local)
        run: |
          docker run -d --rm --name smoke_container -p 8001:8000 local-test:${{ github.sha }}
          for i in $(seq 1 12); do
            sleep 2
            if curl -sS http://127.0.0.1:8001/ >/dev/null 2>&1; then
              echo 'smoke-run OK'
              docker stop smoke_container || true
              break
            fi
            echo 'waiting...'
          done
          if docker ps -a --format '{{.Names}}' | grep -q smoke_container; then
            docker rm -f smoke_container || true
          fi

      - name: Publish Release (un-draft)
        run: |
          apt-get update && apt-get install -y jq
          REP='${{ github.repository }}'
          TAG='${{ github.ref_name }}'
          echo "Finding release for $REP tag $TAG"
          JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$REP/releases/tags/$TAG")
          ID=$(echo "$JSON" | jq -r .id)
          if [ "$ID" = "null" ] || [ -z "$ID" ]; then
            echo "Release not found; aborting publish"; exit 1
          fi
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" -d '{"draft":false}' "https://api.github.com/repos/$REP/releases/$ID"

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Optionally push to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN && secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} $DOCKERHUB_USERNAME/${{ github.repository }}:${{ github.ref_name }}
          docker push $DOCKERHUB_USERNAME/${{ github.repository }}:${{ github.ref_name }}
