name: Release (PyPI)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      dist_files: ${{ steps.make_dist_output.outputs.dist_files }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.cfg') }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ github.ref_name }}
          path: dist/*

      - name: Smoke test built wheel
        run: python -c "print('skipping detailed smoke test in CI')"

      - name: Publish to PyPI (or custom repository)
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PUBLISH_REPOSITORY_URL: ${{ secrets.PUBLISH_REPOSITORY_URL }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is not set; skipping publish.";
            exit 0;
          fi
          if [ -n "${PUBLISH_REPOSITORY_URL}" ]; then
            python -m twine upload --repository-url "${PUBLISH_REPOSITORY_URL}" -u __token__ -p "${PYPI_API_TOKEN}" dist/*;
          else
            python -m twine upload -u __token__ -p "${PYPI_API_TOKEN}" dist/*;
          fi

      - name: Create GitHub Release (draft)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: ''

      - name: Make dist files list for upload
        id: make_dist_output
        run: |
          files=$(python -c "import json,glob,os; print(json.dumps([os.path.basename(p) for p in sorted(glob.glob('dist/*'))]))")
          echo "dist_files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  upload-assets:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-wheel.outputs.dist_files) }}
    steps:
      - name: Upload dist file
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.build-wheel.outputs.upload_url }}
          asset_path: dist/${{ matrix.file }}
          asset_name: ${{ matrix.file }}

  build-docker:
    runs-on: ubuntu-latest
    needs: upload-assets
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout (to get Dockerfile & context)
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts-${{ github.ref_name }}
          path: ./dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
