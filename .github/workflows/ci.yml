name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set environment for UTF-8
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests (full suite for coverage)
        run: |
          # Run the full test suite so coverage reflects the whole codebase.
          python -m pytest -q

  miner-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set environment for UTF-8
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      - name: Install deps + spaCy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Ensure NumPy version compatible with some compiled deps (faiss)
          pip install "numpy<2"
          # Install faiss CPU build so vector_store import succeeds in CI
          pip install faiss-cpu || true
          # install spaCy pinned to the model training version (reduces compatibility warnings)
          pip install "spacy==3.7.4"
          # Do not auto-download spaCy English model here; the integration job will
          # prefer the repository-packaged model at harvester/miner/ner_model/model-best.
      - name: Run miner integration tests
        env:
          # Override global pytest addopts (pytest.ini) so a single integration
          # test run can't fail the whole job due to global coverage thresholds.
          PYTEST_ADDOPTS: "-q"
        run: |
          # Show the model directory contents for debugging and fail fast if not present.
          MODEL_DIR="$GITHUB_WORKSPACE/harvester/miner/ner_model/model-best"
          echo "Model path: $MODEL_DIR"
          if [ -d "$MODEL_DIR" ]; then
            echo "Found repo model-best at $MODEL_DIR"
            # Ensure path permissions and show contents
            ls -la "$MODEL_DIR" || true
            # If model was accidentally committed as LFS pointers, show file sizes
            echo "---- file listing with sizes ----"
            find "$MODEL_DIR" -type f -exec ls -l {} \; || true
            SPACY_MODEL="$MODEL_DIR" python -m pytest tests/test_miner_integration.py
          else
            echo "model-best not found in repo; falling back to downloading en_core_web_sm"
            python -m spacy download en_core_web_sm
            SPACY_MODEL="en_core_web_sm" python -m pytest tests/test_miner_integration.py
          fi
