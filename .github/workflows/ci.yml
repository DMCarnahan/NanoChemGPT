            SPACY_MODEL="en_core_web_sm" python -m pytest --override-ini=addopts= tests/test_miner_integration.py
          fi
            SPACY_MODEL="$MODEL_DIR" python -m pytest --override-ini=addopts= tests/test_miner_integration.py
