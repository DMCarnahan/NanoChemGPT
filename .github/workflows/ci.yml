name: CI

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff
      - name: Run isort
        run: python -m isort . --profile black
      - name: Run black (check)
        run: python -m black --check .
      - name: Run ruff (report)
        run: python -m ruff check . --exit-zero

  test:
    runs-on: ubuntu-latest
    needs: format-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set environment for UTF-8
        run: echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests (full suite for coverage)
        run: python -m pytest -q

  miner-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set environment for UTF-8
        run: echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      - name: Install deps + spaCy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "numpy<2"
          pip install faiss-cpu || true
          pip install "spacy==3.7.4"
      - name: Run miner integration tests
        env:
          PYTEST_ADDOPTS: "-q"
        run: |
          MODEL_DIR="$GITHUB_WORKSPACE/harvester/miner/ner_model/model-best"
          echo "Model path: $MODEL_DIR"
          if [ -d "$MODEL_DIR" ]; then
            echo "Found repo model-best at $MODEL_DIR"
            ls -la "$MODEL_DIR" || true
            find "$MODEL_DIR" -type f -exec ls -l {} \; || true
            SPACY_MODEL="$MODEL_DIR" python -m pytest --override-ini=addopts= tests/test_miner_integration.py
          else
            echo "model-best not found in repo; falling back to downloading en_core_web_sm"
            python -m spacy download en_core_web_sm
            SPACY_MODEL="en_core_web_sm" python -m pytest --override-ini=addopts= tests/test_miner_integration.py
          fi
