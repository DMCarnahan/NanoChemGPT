[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov=harvester
    --cov=retriever
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that take more than 30 seconds
    requires_api: Tests that require external API access
    requires_server: Tests that require the server to be running

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning