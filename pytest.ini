[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=converter
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

markers =
    unit: Unit tests
    integration: Integration tests for miner pipeline and end-to-end workflows
    slow: Slow tests that take more than 30 seconds
    requires_api: Tests that require external API access
    requires_server: Tests that require the server to be running

[coverage:run]
omit = 
    app.py
    harvester/*
    retriever/*
    mech_reasoning/*
    scripts/*
    vector_store/*
    workers/*
    examples/*
    scaffold/*
    app_utils/*
    **/tests/*

markers =
    unit: Unit tests
    integration: Integration tests for miner pipeline and end-to-end workflows
    slow: Slow tests that take more than 30 seconds
    requires_api: Tests that require external API access
    requires_server: Tests that require the server to be running

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Avoid collecting integration scripts under scripts/ which expect a running server
norecursedirs = scripts