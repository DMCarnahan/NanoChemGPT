[build]
builder = "NIXPACKS"

[env]
# Embedding config for FAISS/upload stores. The literature retriever below uses
# deterministic word + chemical-character TF-IDF indexes.
EMBED_BACKEND            = "st"
EMBED_MODEL              = "sentence-transformers/all-MiniLM-L6-v2"
DATA_DIR                 = "/data"
HARVEST_OUT_DIR          = "/data/harvester/out_auto"
INDEX_DIR_DOC            = "/data/vector_store_doc"
INDEX_DIR_PASSAGE        = "/data/vector_store_passage"

# existing paths
INDEX_DIR                = "/data/vector_store"                      # kept for backward-compat; points to DOC
BUNDLE_PATH              = "/data/harvester/out_auto/bundle.jsonl"
BUNDLE_AUTO              = "/data/harvester/out_auto/bundle.jsonl"

# retriever envs (your app can read these to choose an index)
RETRIEVER_INDEX_DIR_DOC      = "/data/vector_store_doc"
RETRIEVER_INDEX_DIR_PASSAGE  = "/data/vector_store_passage"
# Optional: colon-separated list if your retriever supports multiple
RETRIEVER_INDEX_DIRS         = "/data/vector_store_doc:/data/vector_store_passage"

LOOKUP_BACKEND = "none"
PYTHONPATH     = "/app"
PYTHONUNBUFFERED = "1"

[phases.install]
cmds = [
  "pip install -U pip wheel",
  "pip install -r requirements.txt"
]

[phases.start]
cmd = """bash -lc '
  set -euo pipefail
  : ${PORT:=8000}
  : ${BUNDLE_PATH:=/data/harvester/out_auto/bundle.jsonl}
  : ${INDEX_DIR_DOC:=/data/vector_store_doc}
  : ${INDEX_DIR_PASSAGE:=/data/vector_store_passage}
  export RETRIEVER_URL=http://127.0.0.1:${PORT}/retriever
  # Keep RETRIEVER_INDEX_DIR for legacy callers → point to DOC index by default
  export RETRIEVER_INDEX_DIR="${INDEX_DIR_DOC}"
  export RETRIEVER_INDEX_DIR_DOC="${INDEX_DIR_DOC}"
  export RETRIEVER_INDEX_DIR_PASSAGE="${INDEX_DIR_PASSAGE}"
  export RETRIEVER_INDEX_DIRS="${INDEX_DIR_DOC}:${INDEX_DIR_PASSAGE}"
  echo "[start] RETRIEVER_URL=$RETRIEVER_URL"
  echo "[start] BUNDLE_PATH=$BUNDLE_PATH"
  echo "[start] INDEX_DIR_DOC=$INDEX_DIR_DOC"
  echo "[start] INDEX_DIR_PASSAGE=$INDEX_DIR_PASSAGE"
  mkdir -p "$(dirname "$BUNDLE_PATH")" "$INDEX_DIR_DOC" "$INDEX_DIR_PASSAGE"

  # Optional TF-IDF purge/rebuild for sklearn version alignment
  if [ "${REBUILD_TFIDF:-0}" = "1" ]; then
    echo "[start] REBUILD_TFIDF=1 (PURGE_TFIDF=${PURGE_TFIDF:-0})"
    python scripts/rebuild_tfidf.py
  fi

  if [ ! -s "$BUNDLE_PATH" ] && [ -f "/app/data/harvester/out_auto/seed_bundle.jsonl" ]; then
    cp /app/data/harvester/out_auto/seed_bundle.jsonl "$BUNDLE_PATH"
    echo "[start] Seeded bundle -> $BUNDLE_PATH"
  fi

  if [ "${REBUILD_TFIDF:-0}" = "1" ]; then
    echo "[start] Skipping normal index build (REBUILD_TFIDF active)"
  else
    if [ -s "$BUNDLE_PATH" ]; then
      if [ ! -s "$INDEX_DIR_DOC/tfidf.npz" ] || [ ! -s "$INDEX_DIR_DOC/rows.jsonl" ]; then
        echo "[start] Building document index from abstracts..."
        python retriever/index_jsonl.py --bundle "$BUNDLE_PATH" --index_dir "$INDEX_DIR_DOC" --text-key abstract
      else
        echo "[start] Document index already present; skipping rebuild"
      fi
      if [ ! -s "$INDEX_DIR_PASSAGE/tfidf.npz" ] || [ ! -s "$INDEX_DIR_PASSAGE/rows.jsonl" ]; then
        echo "[start] Building passage index from methods..."
        python retriever/index_jsonl.py --bundle "$BUNDLE_PATH" --index_dir "$INDEX_DIR_PASSAGE" --text-key methods
      else
        echo "[start] Passage index already present; skipping rebuild"
      fi
    else
      echo "[start] No bundle at $BUNDLE_PATH; skipping index"
    fi
  fi

  exec gunicorn -k uvicorn.workers.UvicornWorker -w "${WEB_CONCURRENCY:-2}" --timeout "${GUNICORN_TIMEOUT:-180}" \
    --worker-tmp-dir /dev/shm -b 0.0.0.0:${PORT} main_asgi:app
'"""
