<!doctype html><meta charset="utf-8">
<h2>Admin</h2>
<input id="tok" placeholder="Bearer token">
<button onclick="go('/admin/volinfo')">volinfo</button>
<button onclick="post('/admin/reindex_builtin')">reindex</button>
<button onclick="go('/admin/index_stats')">index_stats</button>
<input id="q" placeholder="query">
<button onclick="go('/admin/vs_search?q='+encodeURIComponent(document.getElementById('q').value))">vs_search</button>
<pre id="out"></pre>
<script>
async function go(path){ await req('GET', path); }
async function post(path){ await req('POST', path); }
async function req(method, path){
  const r = await fetch(path, {
    method, headers: { Authorization: 'Bearer ' + document.getElementById('tok').value }
  });
  document.getElementById('out').textContent = await r.text();
}
</script>
