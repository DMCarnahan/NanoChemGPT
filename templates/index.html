<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoChemGPT</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <style>
    :root {
      --bg: #0b0f14;
      --bg-elev: #0f1520;
      --card: #111827;
      --card-2: #0e1726;
      --text: #e5e7eb;
      --text-muted: #a5b4cf;
      --brand: #60a5fa;
      --brand-strong: #3b82f6;
      --ok: #34d399;
      --warn: #f59e0b;
      --err: #ef4444;
      --ring: 0 0 0 3px rgba(59,130,246,.35);
      --radius: 16px;
      --shadow-1: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35);
      --shadow-2: 0 1px 2px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.45);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Inter, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc; --bg-elev: #ffffff; --card: #ffffff; --card-2:#f8fafc;
        --text: #0b1220; --text-muted: #5b6b7d;
        --brand: #2563eb; --brand-strong:#1d4ed8;
        --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.08);
        --shadow-2: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: linear-gradient(180deg, var(--bg), var(--bg-elev)); color: var(--text); font-family: var(--sans); line-height: 1.45; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: min(1100px, 92vw); margin-inline: auto; }
    .stack-2 > * + * { margin-top: .5rem; }
    .stack-4 > * + * { margin-top: 1rem; }
    .stack-6 > * + * { margin-top: 1.5rem; }
    header.site { position: sticky; top: 0; z-index: 40; backdrop-filter: saturate(120%) blur(6px); background: color-mix(in srgb, var(--bg-elev), transparent 30%); border-bottom: 1px solid color-mix(in srgb, var(--text-muted), transparent 85%); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding: .9rem 0; }
    .brand { display:flex; align-items:center; gap:.75rem; font-weight:700; }
    .brand .logo { width: 28px; height:28px; display:grid; place-items:center; border-radius:8px; background: radial-gradient(65% 65% at 50% 35%, var(--brand), var(--brand-strong)); box-shadow: var(--shadow-1); }
    #healthStatus.status { display:flex; align-items:center; gap:.5rem; font-size:.9rem; color:var(--text-muted); }
    .status-dot { width:10px; height:10px; border-radius:50%; background: var(--warn); box-shadow:0 0 0 3px rgba(245,158,11,.15); }
    main { padding: 1.5rem 0 3rem; }
    .grid { display:grid; gap: 1rem; grid-template-columns: repeat(12, minmax(0,1fr)); }
    .card { grid-column: span 12; background: linear-gradient(180deg, var(--card), var(--card-2)); border: 1px solid color-mix(in srgb, var(--text-muted), transparent 85%); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow-1); }
    @media (min-width: 900px) {
      .card.span-6 { grid-column: span 6; }
      .card.span-8 { grid-column: span 8; }
      .card.span-4 { grid-column: span 4; }
    }
    .card-title { margin: 0 0 .5rem; font-size: 1.1rem; letter-spacing:.2px; }
    .subhead { margin: 0 0 .25rem; font-size: .95rem; color: var(--text-muted); font-weight: 600; }
    .row { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
    .btn { appearance:none; border: 1px solid color-mix(in srgb, var(--brand), transparent 60%); background: linear-gradient(180deg, var(--brand), var(--brand-strong)); color: white; font-weight:600; padding: .6rem .85rem; border-radius: 12px; cursor:pointer; box-shadow: var(--shadow-1); }
    .btn:hover { filter: brightness(1.05); }
    .btn.secondary { background: transparent; color: var(--text); border-color: color-mix(in srgb, var(--text), transparent 75%); }
    .btn.tertiary { background: transparent; color: var(--text-muted); border-color: color-mix(in srgb, var(--text), transparent 85%); }
    .btn[disabled] { opacity:.6; cursor:not-allowed; }
    .textarea { width: min(700px, 100%); padding: .7rem .8rem; border-radius: 12px; border:1px solid color-mix(in srgb, var(--text), transparent 80%); background: color-mix(in srgb, var(--bg-elev), transparent 0%); color: var(--text); outline: none; box-shadow: inset 0 2px 0 rgba(0,0,0,.05); }
    .textarea:focus { box-shadow: var(--ring); border-color: var(--brand); }
    .pre { background: color-mix(in srgb, var(--bg-elev), transparent 6%); border-radius: 12px; padding: .8rem; overflow:auto; border:1px solid color-mix(in srgb, var(--text), transparent 85%); box-shadow: inset 0 1px 0 rgba(0,0,0,.08); font-family: var(--mono); }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header class="site">
    <div class="container topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12"/><path d="M9 3v5l-4 8a4 4 0 0 0 3.6 6h6.8A4 4 0 0 0 19 16l-4-8V3"/>
          </svg>
        </div>
        <h1 style="font-size:1.1rem;margin:0">NanoChemGPT</h1>
      </div>
      <div id="healthStatus" class="status">
        <span class="status-dot"></span>
        <span class="status-txt">checking…</span>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <section class="card span-8 mt-6" aria-labelledby="sec-ask">
      <h2 id="sec-ask" class="card-title">Ask NanoChemGPT</h2>
      <label class="visually-hidden" for="question">Enter your question</label>
      <textarea id="question" class="textarea" rows="5" placeholder="Ask a synthesis question…"></textarea>
      <div class="row mt-3">
        <button id="askBtn" class="btn" type="button">Ask</button>
        <div class="segmented" role="radiogroup" style="display:flex;gap:6px;margin-left:8px;">
          <button id="robotBtn" class="btn tertiary" role="radio" aria-checked="true">Robot mode</button>
          <button id="reasoningBtn" class="btn tertiary" role="radio" aria-checked="false">Reasoning mode</button>
        </div>
      </div>
      <div id="askMsg" class="alert mt-3 hidden"></div>
      <section class="mt-4">
        <h3 class="subhead">Answer</h3>
        <pre id="answerPre" class="pre"></pre>
      </section>
      <section class="mt-4">
        <h3 class="subhead">Rationale</h3>
        <pre id="rationalePre" class="pre"></pre>
      </section>
    </section>
  </main>

  <footer class="site container">
    <span>© <span id="year"></span> NanoChemGPT · Built for rapid synthesis Q&A</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const hs = document.getElementById('healthStatus');
    if (hs) setTimeout(()=>{ hs.querySelector('.status-dot').style.background = 'var(--ok)'; hs.querySelector('.status-txt').textContent = 'healthy'; }, 600);
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
