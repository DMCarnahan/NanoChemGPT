<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoChemGPT</title>

  <!-- Load your stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>NanoChemGPT</h1>
      <div id="healthStatus" class="status">
        <span class="status-dot"></span>
        <span class="status-txt">checking…</span>
      </div>
    </div>

    <div class="card upload">
      <div class="input-row">
        <input id="fileInput" type="file" accept=".pdf,.json,.txt,.md,.csv">
        <button id="uploadBtn" class="btn">
          <span class="spinner hidden"></span>
          Upload
        </button>
      </div>
      <div id="fileHint" class="small muted"></div>

      <div id="progress" class="progress mt-3">
        <div id="progressInner"></div>
      </div>

      <div id="result" class="alert mt-3"></div>
    </div>
  </div>

  <!-- Load your JavaScript (defer = run after parsing) -->
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
